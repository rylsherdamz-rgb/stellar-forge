name: CI

on:
  push:
    branches: [master, staging, dev]
  pull_request:
    branches: [master, staging, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package Tests (github + stellar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: GitHub PR verification tests
        run: node --test
        working-directory: packages/github
      - name: Stellar wallet + asset tests
        run: node --test
        working-directory: packages/stellar

  bounty-escrow:
    name: Bounty Escrow Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/bounty-escrow
      - name: cargo test (bounty-escrow)
        run: cargo test --manifest-path contracts/bounty-escrow/Cargo.toml

  web:
    name: Web App Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npm run build -w @stellar-forge/web
