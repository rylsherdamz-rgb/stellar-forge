name: CI

on:
  push:
    branches: [master, staging, dev]
  pull_request:
    branches: [master, staging, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package Tests (github + stellar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: GitHub PR verification tests
        run: node --test
        working-directory: packages/github
      - name: Install Stellar SDK (exercises XDR assembly tests)
        run: npm install --no-save --no-audit --no-fund @stellar/stellar-sdk@13
        working-directory: packages/stellar
      - name: Stellar wallet + contract client tests
        run: node --test
        working-directory: packages/stellar

  bounty-escrow:
    name: Bounty Escrow Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: cargo test (bounty-escrow)
        run: cargo test --manifest-path contracts/bounty-escrow/Cargo.toml
      - name: Build release WASM
        run: cargo build --release --target wasm32v1-none --manifest-path contracts/Cargo.toml -p bounty-escrow
      - name: Report WASM size
        run: ls -l contracts/target/wasm32v1-none/release/bounty_escrow.wasm

  web:
    name: Site Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        run: npm install
        working-directory: site
      - name: Build site
        run: npm run build
        working-directory: site
