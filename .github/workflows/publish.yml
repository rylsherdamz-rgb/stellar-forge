name: Publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-cli:
    name: Publish create-stellar-agentic
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Sync version from git tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            node -e "const p=require('./package.json'); p.version='$TAG'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"
            echo "Version synced to $TAG"
          else
            echo "Not a version tag ($GITHUB_REF_NAME), skipping version sync"
          fi
        working-directory: packages/create-stellar-agentic

      - name: Prepare package files
        run: |
          for dir in templates skills agents evals data scripts .claude .claude-plugin; do
            cp -r "$dir" packages/create-stellar-agentic/
          done
          cp SKILL.md CLAUDE.md README.md .env.example .mcp.json packages/create-stellar-agentic/

      - name: Publish to npmjs.org
        run: |
          node -e "const p=require('./package.json'); p.name='create-stellar-agentic'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          npm publish --provenance --access public
        working-directory: packages/create-stellar-agentic
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


