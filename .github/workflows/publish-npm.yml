name: Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish create-stellar-agentic
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install workspace deps
        run: npm ci

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/create-stellar-agentic/package.json').version")"
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG — bump packages/create-stellar-agentic/package.json first"
            exit 1
          fi

      - name: Run tests (gate)
        run: npm test -w forge-gateway

      - name: Publish to npm
        run: npm publish -w create-stellar-agentic --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
