<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forge Gateway Playground</title>
<style>
  :root { --bg:#0b0e14; --panel:#12161f; --border:#1e2530; --text:#e6eaf2; --muted:#8b94a7; --accent:#7c5cff; --ok:#3ddc97; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--border); }
  header .logo { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#7c5cff,#3ddc97); }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns: 340px 1fr; gap:16px; padding:16px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px; }
  input, textarea, select { width:100%; background:#0d1117; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; }
  textarea { min-height:120px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:14px; cursor:pointer; font-weight:600; }
  button.secondary { background:#1a2230; color:var(--text); }
  .row { display:flex; gap:8px; margin-top:8px; }
  .results { margin-top:12px; }
  .hit { border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .hit .t { font-weight:600; font-size:14px; }
  .hit .type { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; padding:2px 6px; border-radius:4px; background:#1a2230; color:var(--muted); margin-left:8px; }
  .hit .d { color:var(--muted); font-size:12px; margin-top:4px; }
  .hit .s { color:var(--accent); font-size:11px; margin-top:4px; font-family:ui-monospace,monospace; }
  pre { background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:12px; overflow:auto; font-size:12px; line-height:1.5; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .status { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin-left:auto; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>Forge Gateway</h1>
  <span class="sub">Stellar context, one connection — search &amp; execute against the catalog</span>
  <div class="status"><span class="dot"></span><span id="health">checking…</span></div>
</header>
<main>
  <section>
    <h2>Catalog search</h2>
    <input id="query" placeholder="e.g. paid api x402 usdc" value="paid api x402" />
    <div class="row">
      <select id="type">
        <option value="">all types</option>
        <option value="playbook">playbooks</option>
        <option value="standard">standards (SEP/CAP)</option>
        <option value="skill">skills</option>
        <option value="ecosystem">ecosystem</option>
        <option value="intel">community intel</option>
        <option value="eval">evals</option>
        <option value="template">templates</option>
      </select>
      <button id="searchBtn">Search</button>
    </div>
    <div class="results" id="results"></div>
  </section>
  <section>
    <h2>Sandboxed execute</h2>
    <textarea id="code">// no network, no require — only catalog.get / catalog.search
const e = catalog.get('sep-41');
const hits = catalog.search('escrow milestone');
({ entry: e && e.title, hits });</textarea>
    <div class="row">
      <button id="runBtn">Run</button>
      <button class="secondary" id="resetBtn">Reset</button>
    </div>
    <pre id="output">awaiting run…</pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
async function health() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    $('health').textContent = `ok · ${j.catalog} catalog entries · ${j.uptime.toFixed(0)}s up`;
  } catch { $('health').textContent = 'offline'; }
}
function renderHits(hits) {
  $('results').innerHTML = hits.length === 0
    ? '<div class="hit"><span class="muted">no results</span></div>'
    : hits.map(h => `
      <div class="hit">
        <span class="t">${h.title}</span><span class="type">${h.type}</span>
        <div class="d">${h.description}</div>
        <div class="s">${h.source}</div>
      </div>`).join('');
}
async function doSearch() {
  const q = encodeURIComponent($('query').value);
  const t = $('type').value;
  const r = await fetch(`/api/search?q=${q}${t ? '&type=' + t : ''}`);
  const j = await r.json();
  renderHits(j.hits);
}
async function doRun() {
  const r = await fetch('/api/execute', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: $('code').value }),
  });
  const j = await r.json();
  $('output').className = j.error ? 'err' : 'ok';
  $('output').textContent = JSON.stringify(j, null, 2);
}
$('searchBtn').onclick = doSearch;
$('runBtn').onclick = doRun;
$('resetBtn').onclick = () => {
  $('code').value = "// no network, no require — only catalog.get / catalog.search\nconst e = catalog.get('sep-41');\nconst hits = catalog.search('escrow milestone');\n({ entry: e && e.title, hits });";
  doRun();
};
$('query').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
health(); doSearch(); doRun();
</script>
</body>
</html>
